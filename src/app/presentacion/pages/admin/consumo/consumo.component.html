

<p-button
  label="Nuevo Consumo"
  severity="info"
  (onClick)="abrirNuevoPlan()"
  class="me-2"
/>
@if (rol != 'admin') {
  <p-button
    label="Cerrar sesión"
    severity="danger"
    (onClick)="logout()"
  />
}
<p-toast></p-toast>
<p-table [value]="consumos" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
      <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Capacidad</th>
          <th>Tope Mensual</th>
          <th>Opciones</th>
      </tr>
  </ng-template>
  <ng-template #body let-plan>
      <tr>
          <td>{{ plan.idPlan }}</td>
          <td>{{ plan.nombre }}</td>
          <td>{{ plan.velocidadMbps }}</td>
          <td>{{ plan.topeMensualGB }}</td>
          <td>
            <div class="">
              <button
                pButton
                type="button"
                icon="pi pi-pencil"
                label="Editar"
                class="p-button-sm p-button-info"
                (click)="abrirDialogEditar(plan)"
                style="margin-right: 10px;"
              ></button>
              <button
                pButton
                type="button"
                icon="pi pi-trash"
                label="Eliminar"
                class="p-button-sm p-button-info"
                (click)="eliminarCliente(plan)"
                style="margin-right: 10px;"
              ></button>
            </div>
          </td>
      </tr>
  </ng-template>
</p-table>
